<button
  type="button"
  class="top-bar__toggle"
  aria-label="Toggle navigation"
  [attr.aria-expanded]="layout.isMobile() ? layout.mobileOpen() : !layout.mini()"
  (click)="layout.toggle()"
>
  <i class="top-bar__toggle-icon pi pi-bars" aria-hidden="true"></i>
</button>

<span class="top-bar__title">eVat Spectrum</span>

<div class="top-bar__actions">
  <ng-content />

  <button
    type="button"
    class="top-bar__theme-toggle"
    [attr.aria-label]="layout.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    [attr.aria-pressed]="layout.isDark()"
    (click)="layout.toggleTheme()"
  >
    <i
      class="pi"
      [class.pi-moon]="!layout.isDark()"
      [class.pi-sun]="layout.isDark()"
      aria-hidden="true"
    ></i>
  </button>

  <!-- Base font size: every layout token is in `rem`, so this scales the whole UI. -->
  <div class="top-bar__font-size" role="group" aria-label="Base font size">
    <button
      type="button"
      class="top-bar__font-button"
      aria-label="Decrease font size"
      [disabled]="!layout.canShrinkFont()"
      (click)="layout.changeFontSize(-1)"
    >
      <i class="pi pi-minus" aria-hidden="true"></i>
    </button>
    <!-- Fixed px, so the readout doesn't resize itself while it is being used. -->
    <output class="top-bar__font-value" aria-live="polite">{{ layout.fontSize() }}px</output>
    <button
      type="button"
      class="top-bar__font-button"
      aria-label="Increase font size"
      [disabled]="!layout.canGrowFont()"
      (click)="layout.changeFontSize(1)"
    >
      <i class="pi pi-plus" aria-hidden="true"></i>
    </button>
  </div>
  @if (userName()) {
    <span class="top-bar__user">
      <i class="top-bar__user-icon pi pi-user" aria-hidden="true"></i>
      <span class="top-bar__user-name">JH</span>
    </span>
  }
</div>
